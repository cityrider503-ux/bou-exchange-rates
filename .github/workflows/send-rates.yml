name: Send BOU exchange rates

on:
  # No `cron:` here on purpose. GitHub's scheduler is best-effort and this
  # repo measured 2h50m-6h19m late on the free tier, so it cannot meet the
  # 08:00 posting deadline. Scheduling now lives in the Cloudflare Worker
  # (cloudflare-worker/), which fires workflow_dispatch at 04:30 UTC = 07:30
  # EAT Mon-Fri and lands the email around 07:32.
  #
  # Keeping both would send two emails every weekday: one punctual from the
  # Worker, one hours later from GitHub's cron.
  workflow_dispatch:

permissions:
  contents: read

# Prevent a manual dispatch from overlapping the scheduled run and mailing the
# same rates twice.
concurrency:
  group: send-rates
  cancel-in-progress: false

jobs:
  send-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Fetch rates and send email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py
