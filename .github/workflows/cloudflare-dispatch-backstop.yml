name: Cloudflare dispatch backstop

# If Cloudflare cron does not dispatch `send-rates` on a weekday morning,
# this workflow fires a rescue dispatch and opens one issue for visibility.
on:
  schedule:
    # 05:15 UTC = 08:15 EAT, after the intended 07:30 EAT trigger window.
    - cron: "15 5 * * 1-5"
  workflow_dispatch:

permissions:
  actions: write
  issues: write

concurrency:
  group: cloudflare-dispatch-backstop
  cancel-in-progress: false

jobs:
  rescue-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Rescue dispatch when today's run is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Uganda is UTC+3 with no daylight saving.
          today_eat=$(date -u -d "+3 hours" +%Y-%m-%d)
          dow_eat=$(date -u -d "+3 hours" +%u) # 1=Mon .. 7=Sun

          if [ "$dow_eat" -ge 6 ]; then
            echo "Weekend in Uganda — no rates expected."
            exit 0
          fi

          runs_json=$(gh api "repos/${REPO}/actions/workflows/send-rates.yml/runs?per_page=100")

          successful_today=$(jq -r --arg today "$today_eat" \
            '[.workflow_runs[]
              | select(.conclusion == "success"
                      and (.created_at | startswith($today)))]
            | length' <<<"$runs_json")

          inflight_today=$(jq -r --arg today "$today_eat" \
            '[.workflow_runs[]
              | select((.status == "queued" or .status == "in_progress")
                      and (.created_at | startswith($today)))]
            | length' <<<"$runs_json")

          cloudflare_dispatch_today=$(jq -r --arg today "$today_eat" \
            '[.workflow_runs[]
              | select(.event == "workflow_dispatch"
                      and ((.display_title // "") | endswith("(cloudflare-cron)"))
                      and (.created_at | startswith($today)))]
            | length' <<<"$runs_json")

          echo "successful_today=${successful_today}"
          echo "inflight_today=${inflight_today}"
          echo "cloudflare_dispatch_today=${cloudflare_dispatch_today}"

          if [ "$successful_today" -gt 0 ]; then
            echo "A successful send-rates run already exists today."
            exit 0
          fi

          if [ "$inflight_today" -gt 0 ]; then
            echo "A send-rates run is already queued or in progress."
            exit 0
          fi

          echo "No successful or in-flight run today. Dispatching rescue run."
          now_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh api --method POST "repos/${REPO}/actions/workflows/send-rates.yml/dispatches" \
            -f ref=main \
            -f inputs[trigger_source]=github-backstop \
            -f inputs[trigger_scheduled_time_utc]="$now_utc"

          # Open one issue per day when Cloudflare missed the morning dispatch.
          if [ "$cloudflare_dispatch_today" -eq 0 ]; then
            title="Cloudflare cron missed send-rates dispatch on ${today_eat}"
            existing=$(gh issue list --repo "$REPO" --state all --limit 1 \
              --search "${title} in:title" --json number --jq 'length')

            if [ "$existing" = "0" ]; then
              body=$(cat <<EOF
              No \`Send BOU exchange rates (cloudflare-cron)\` run was detected on ${today_eat} by 08:15 EAT.

              The backstop workflow dispatched \`send-rates.yml\` to keep delivery on time.

              Check:
              1. Cloudflare Worker \`bou-rates-trigger\` → Observability for a missing or failed cron invocation.
              2. Cloudflare Worker trigger configuration is still \`30 4 * * mon-fri\`.
              3. Worker secret \`GH_TOKEN\` is present and valid.

              Raised by \`cloudflare-dispatch-backstop.yml\`.
              EOF
              )

              gh issue create --repo "$REPO" --title "$title" --body "$body"
              echo "Opened issue: ${title}"
            else
              echo "Issue already exists for ${today_eat}. Not filing a duplicate."
            fi
          else
            echo "A workflow_dispatch run already happened today; skipping Cloudflare-miss issue."
          fi
